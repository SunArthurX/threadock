name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust Tests & Lints
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings           -W clippy::unwrap_used           -W clippy::pedantic           -A clippy::missing_errors_doc           -A clippy::missing_panics_doc           -A clippy::cast_precision_loss           -A clippy::cast_possible_wrap           -A clippy::cast_sign_loss           -A clippy::cast_possible_truncation           -A clippy::doc_markdown

      - name: Clippy (tauri)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Generate API docs
        working-directory: apps/desktop/src-tauri
        run: cargo run --example typegen

  test-matrix:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (workspace)
        run: cargo test --workspace

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check compiles on MSRV
        run: cargo check --workspace

  audit:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    # 报告新 advisory 而不冻结 PR（修复窗口策略可后续收紧）
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install deps
        working-directory: apps/desktop
        run: npm ci

      - name: TypeScript check
        working-directory: apps/desktop
        run: npx tsc --noEmit

      - name: Lint
        working-directory: apps/desktop
        run: npm run lint

      - name: Unit tests
        working-directory: apps/desktop
        run: npm test

      - name: Vite build
        working-directory: apps/desktop
        run: npx vite build

  tauri-build:
    name: Tauri Build
    runs-on: macos-latest
    needs: [rust, frontend, test-matrix]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: apps/desktop
        run: npx tauri build --debug
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
