name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust Tests & Lints
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings           -W clippy::unwrap_used           -W clippy::pedantic           -A clippy::missing_errors_doc           -A clippy::missing_panics_doc           -A clippy::cast_precision_loss           -A clippy::cast_possible_wrap           -A clippy::cast_sign_loss           -A clippy::cast_possible_truncation           -A clippy::doc_markdown

      - name: Clippy (tauri)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Generate API docs
        working-directory: apps/desktop/src-tauri
        run: cargo run --example typegen

  test-matrix:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ch-adapter-host/tests/process_isolation.rs 通过 spawn 子进程跑 markdown adapter
      # 二进制做集成测试；cargo test --workspace 不会编译 [[bin]]，必须先 cargo build。
      # 旧版 CI 没这步，导致 3 个 test 在 win+ubuntu 一致挂 (NotFound)。
      - name: Build adapter binaries
        run: cargo build --bin ch-adapter-markdown
      - name: Test (workspace)
        run: cargo test --workspace

  jieba:
    name: jieba tokenizer feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # plan §13.1 可插拔分词器：jieba feature 默认关闭，单独验证编译+测试
      - name: Test with jieba feature
        run: cargo test -p ch-search --features jieba

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check compiles on MSRV
        run: cargo check --workspace

  audit:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    # 当前状态：升 tantivy 0.22→0.26 后，3 个 advisory 修掉 2 个：
    #   ✅ RUSTSEC-2024-0384 (instant unmaintained)  — measure_time 0.9 移除 instant
    #   ✅ RUSTSEC-2026-0002 (lru stacked-borrows)    — tantivy 0.26 → lru 0.16.4 ≥ 0.16.3
    #   ⚠️ RUSTSEC-2026-0253 (lru use-after-free)    — 上游 blocked：
    #      tantivy 0.26 锁 lru ^0.16.3；修这个 bug 要 lru ≥ 0.18.2。
    #      等 tantivy 升 lru 0.18+ 后移除 --ignore。
    # 之前用 rustsec/audit-check@v2 + 默认 GITHUB_TOKEN，因为 check-run 权限不足
    # 报 "Resource not accessible by integration" 致 job 标 failure。
    # 改用 cargo-audit 直接跑，exit 0 即 success。
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo-audit
        run: cargo audit --ignore RUSTSEC-2026-0253

  frontend:
    name: Frontend Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install deps
        working-directory: apps/desktop
        run: npm ci

      - name: TypeScript check
        working-directory: apps/desktop
        run: npx tsc --noEmit

      - name: Lint
        working-directory: apps/desktop
        run: npm run lint

      - name: Unit tests
        working-directory: apps/desktop
        run: npm test

      - name: Vite build
        working-directory: apps/desktop
        run: npx vite build

  tauri-build:
    name: Tauri Build
    runs-on: macos-latest
    needs: [rust, frontend, test-matrix]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install deps
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: apps/desktop
        run: npx tauri build --debug
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
