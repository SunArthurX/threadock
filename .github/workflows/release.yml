name: Release

# v1.0.0 发布流水线（plan §21 精简版）：
# 1. 推 v* tag 触发
# 2. 三平台构建 Tauri 安装包（dmg / nsis+msi / appimage+deb）+ CLI 二进制
# 3. 生成 SHA256 校验和，一并挂到 GitHub Release
#
# ⚠️ 当前产物「未签名」（plan §6-4 的签名/公证待证书到位后接入）：
# - macOS 首次打开需右键 → 打开（或 xattr -dr com.apple.quarantine）
# - Windows SmartScreen 会提示「仍要运行」
# 接入签名时在 job env 填 APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
# APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID 与
# TAURI_SIGNING_PRIVATE_KEY（Updater 用）即可，无需改结构。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 GitHub Release 与上传产物

jobs:
  # ── 桌面安装包（三平台并行）────────────────────────────────────────
  tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux bundle deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        run: npm install
        working-directory: apps/desktop

      # tauri-action：构建 + 打包 + 建 Release + 上传产物（含 CLI 工作区一并编译）
      - name: Build and release Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Threadock ${{ github.ref_name }}"
          releaseBody: |
            见 [CHANGELOG](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)。

            **未签名构建**（证书待接入）：
            - macOS：首次打开请右键 → 打开；或 `xattr -dr com.apple.quarantine <app>`
            - Windows：SmartScreen 选「更多信息 → 仍要运行」
            - 校验下载：比对 Release 中的 SHA256SUMS 文件
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ── CLI 二进制（ch + daemon + adapters，与桌面端分开供脚本场景）──────
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: threadock-cli-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: threadock-cli-macos-x64.tar.gz
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: threadock-cli-linux-x64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: threadock-cli-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI workspace binaries
        run: cargo build --release --target ${{ matrix.target }} -p ch-cli -p ch-daemon -p ch-adapter-markdown -p ch-adapter-jsonl

      - name: Archive (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ch ch-daemon ch-adapter-markdown ch-adapter-jsonl
      - name: Archive (windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/ch.exe, target/${{ matrix.target }}/release/ch-daemon.exe, target/${{ matrix.target }}/release/ch-adapter-markdown.exe, target/${{ matrix.target }}/release/ch-adapter-jsonl.exe -DestinationPath ${{ matrix.archive }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}

  # ── SHA256 校验和（依赖前两个 job 的产物全部上传完毕）────────────────
  checksums:
    needs: [tauri, cli]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download all release assets and write SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets && cd assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber
          shasum -a 256 * > ../SHA256SUMS
          cd ..
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS --clobber --repo "${GITHUB_REPOSITORY}"
