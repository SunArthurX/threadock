[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/storage",
    "crates/raw-store",
    "crates/search",
    "crates/identity-resolver",
    "crates/normalization",
    "crates/export",
    "crates/backup",
    "crates/knowledge",
    "crates/benchmarks",
    "crates/daemon",
    "crates/adapter-sdk",
    "crates/adapter-host",
    "crates/adapter-markdown",
    "crates/adapter-claude-code",
    "crates/adapter-zcode",
    "crates/adapter-cursor",
    "crates/adapter-minimax",
    "crates/adapter-codex",
    "crates/ops-metrics",
    "crates/audit",
    "crates/adapter-jsonl",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/conversation-hub"

[workspace.dependencies]
# 错误处理
thiserror = "1.0"
anyhow = "1.0"
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 时间
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
# ID 生成
uuid = { version = "1", features = ["v4", "serde"] }
# 哈希（内容寻址）
blake3 = "1"
# 压缩（Raw Store，plan §9.6 zstd）
zstd = "0.13"
# 加密（backup，plan §14.3 XChaCha20-Poly1305）
chacha20poly1305 = "0.10"
# 全文检索（plan §9.5 Tantivy）
tantivy = "0.22"
# 日志/追踪
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 异步（MVP 同步即可，留接口）
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
