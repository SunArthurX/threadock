<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbfc"/>
      <stop offset="100%" stop-color="#f0f2f5"/>
    </linearGradient>
    <!-- Apple Blue gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#4f8cff"/>
    </linearGradient>
    <!-- Soft shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0a2540" flood-opacity="0.08"/>
    </filter>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Title -->
  <text x="640" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#0a2540">Threadock Architecture</text>
  <text x="640" y="76" text-anchor="middle" font-size="14" fill="#6b7280">Local-first unified archive · search · knowledge · governance for AI coding agents</text>

  <!-- Layer 1: AI IDE Sources (top) -->
  <text x="80" y="140" font-size="11" font-weight="600" fill="#9ca3af" letter-spacing="1.5">SOURCES · READ-ONLY ADAPTERS</text>
  <g font-size="13" font-weight="500" fill="#0a2540" text-anchor="middle">
    <g transform="translate(120,180)">
      <rect width="140" height="56" rx="10" fill="white" stroke="#d1d5db" filter="url(#shadow)"/>
      <text x="70" y="26">ZCode</text>
      <text x="70" y="44" font-size="10" fill="#6b7280">SQLite</text>
    </g>
    <g transform="translate(280,180)">
      <rect width="140" height="56" rx="10" fill="white" stroke="#d1d5db" filter="url(#shadow)"/>
      <text x="70" y="26">Claude Code</text>
      <text x="70" y="44" font-size="10" fill="#6b7280">~/.claude JSONL</text>
    </g>
    <g transform="translate(440,180)">
      <rect width="140" height="56" rx="10" fill="white" stroke="#d1d5db" filter="url(#shadow)"/>
      <text x="70" y="26">Cursor</text>
      <text x="70" y="44" font-size="10" fill="#6b7280">state.vscdb</text>
    </g>
    <g transform="translate(600,180)">
      <rect width="140" height="56" rx="10" fill="white" stroke="#d1d5db" filter="url(#shadow)"/>
      <text x="70" y="26">MiniMax Code</text>
      <text x="70" y="44" font-size="10" fill="#6b7280">runtime-state.sqlite</text>
    </g>
    <g transform="translate(760,180)">
      <rect width="140" height="56" rx="10" fill="white" stroke="#d1d5db" filter="url(#shadow)"/>
      <text x="70" y="26">Codex</text>
      <text x="70" y="44" font-size="10" fill="#6b7280">~/.codex/sessions</text>
    </g>
    <g transform="translate(920,180)">
      <rect width="140" height="56" rx="10" fill="white" stroke="#d1d5db" filter="url(#shadow)"/>
      <text x="70" y="26">Markdown / JSONL</text>
      <text x="70" y="44" font-size="10" fill="#6b7280">stdin pipe</text>
    </g>
  </g>

  <!-- Arrows from sources to Adapter layer -->
  <g stroke="#9ca3af" stroke-width="1.2" fill="none">
    <path d="M 190 236 L 320 290" marker-end="url(#arrow)"/>
    <path d="M 350 236 L 380 290" marker-end="url(#arrow)"/>
    <path d="M 510 236 L 480 290" marker-end="url(#arrow)"/>
    <path d="M 670 236 L 580 290" marker-end="url(#arrow)"/>
    <path d="M 830 236 L 660 290" marker-end="url(#arrow)"/>
    <path d="M 990 236 L 720 290" marker-end="url(#arrow)"/>
  </g>

  <!-- Layer 2: Adapter / Process isolation -->
  <text x="80" y="305" font-size="11" font-weight="600" fill="#9ca3af" letter-spacing="1.5">ADAPTERS · STDIO JSON-RPC</text>
  <g transform="translate(120,310)">
    <rect width="1040" height="60" rx="10" fill="white" stroke="#d1d5db" filter="url(#shadow)"/>
    <text x="20" y="26" font-size="13" font-weight="600" fill="#0a2540">adapter-host</text>
    <text x="20" y="46" font-size="11" fill="#6b7280">Process isolation · spawn · timeout · crash detection · stdio JSON-RPC 2.0</text>
    <text x="540" y="26" font-size="12" fill="#0071e3">6 adapters</text>
    <text x="540" y="46" font-size="11" fill="#6b7280">markdown · jsonl · claude-code · zcode · cursor · minimax · codex</text>
  </g>

  <!-- Arrow to core -->
  <g stroke="#9ca3af" stroke-width="1.2" fill="none">
    <path d="M 640 370 L 640 400" marker-end="url(#arrow)"/>
  </g>

  <!-- Layer 3: Core (DaemonState) -->
  <text x="80" y="415" font-size="11" font-weight="600" fill="#9ca3af" letter-spacing="1.5">CORE · SINGLE WRITER</text>
  <g transform="translate(120,420)">
    <rect width="1040" height="80" rx="10" fill="url(#accent)" filter="url(#shadow)"/>
    <text x="20" y="30" font-size="14" font-weight="700" fill="white">DaemonState</text>
    <text x="20" y="52" font-size="11" fill="rgba(255,255,255,0.85)">Single point of write · BLAKE3 content addressing · zstd compression · idempotency · completeness scoring</text>
    <text x="20" y="68" font-size="10" fill="rgba(255,255,255,0.7)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Repository · SearchIndex · RawStore · ImportState · Audit</text>
  </g>

  <!-- Arrow to storage -->
  <g stroke="#9ca3af" stroke-width="1.2" fill="none">
    <path d="M 640 500 L 640 525" marker-end="url(#arrow)"/>
  </g>

  <!-- Layer 4: Storage -->
  <text x="80" y="540" font-size="11" font-weight="600" fill="#9ca3af" letter-spacing="1.5">STORAGE · LOCAL</text>
  <g transform="translate(120,545)">
    <rect width="500" height="80" rx="10" fill="white" stroke="#d1d5db" filter="url(#shadow)"/>
    <text x="20" y="28" font-size="13" font-weight="600" fill="#0a2540">SQLite V16</text>
    <text x="20" y="48" font-size="11" fill="#6b7280">WAL · 25+ tables · FTS5 fallback</text>
    <text x="20" y="66" font-size="10" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">conversations · messages · events · knowledge · ops · audit</text>
  </g>
  <g transform="translate(660,545)">
    <rect width="500" height="80" rx="10" fill="white" stroke="#d1d5db" filter="url(#shadow)"/>
    <text x="20" y="28" font-size="13" font-weight="600" fill="#0a2540">Tantivy Index</text>
    <text x="20" y="48" font-size="11" fill="#6b7280">N-gram Chinese + jieba · BM25 · time-ordered hits</text>
    <text x="20" y="66" font-size="10" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">schema auto-migrate on startup</text>
  </g>

  <!-- Layer 5: Frontends (bottom) -->
  <g stroke="#9ca3af" stroke-width="1.2" fill="none">
    <path d="M 370 625 L 370 645" marker-end="url(#arrow)"/>
    <path d="M 910 625 L 910 645" marker-end="url(#arrow)"/>
  </g>
  <text x="80" y="640" font-size="11" font-weight="600" fill="#9ca3af" letter-spacing="1.5">FRONTENDS</text>
  <g font-size="13" font-weight="500" fill="#0a2540" text-anchor="middle">
    <g transform="translate(220,655)">
      <rect width="300" height="50" rx="10" fill="white" stroke="#d1d5db" filter="url(#shadow)"/>
      <text x="150" y="22">Tauri 2 Desktop GUI</text>
      <text x="150" y="40" font-size="10" fill="#6b7280">React + TS · 101 commands · 7 views</text>
    </g>
    <g transform="translate(560,655)">
      <rect width="180" height="50" rx="10" fill="white" stroke="#d1d5db" filter="url(#shadow)"/>
      <text x="90" y="22">ch CLI</text>
      <text x="90" y="40" font-size="10" fill="#6b7280">import · search · export</text>
    </g>
    <g transform="translate(760,655)">
      <rect width="200" height="50" rx="10" fill="white" stroke="#d1d5db" filter="url(#shadow)"/>
      <text x="100" y="22">Daemon JSON-RPC</text>
      <text x="100" y="40" font-size="10" fill="#6b7280">14 methods · stdio</text>
    </g>
    <g transform="translate(980,655)">
      <rect width="180" height="50" rx="10" fill="white" stroke="#d1d5db" filter="url(#shadow)"/>
      <text x="90" y="22">External clients</text>
      <text x="90" y="40" font-size="10" fill="#6b7280">SDK · extensions</text>
    </g>
  </g>
</svg>
